# =============================================================
#  Agent Reach 수집기 설정
# =============================================================
#  Agent Reach 는 AI 에이전트에게 인터넷 접근을 주는 외부 CLI 도구입니다.
#  https://github.com/Panniantong/agent-reach  (MIT)
#
#  ★ 설치되어 있지 않아도 시스템은 100% 정상 동작합니다.
#     설치는 자격증명이 걸린 행위이므로 사용자 승인 사항입니다.
#     설치: .\scripts\install-agent-reach.ps1
#
#  ★ 여기서 무엇을 켜든, 가져온 문서는 전부 Research Firewall 을
#     통과해야 에이전트에게 도달합니다. 등급도 우리 규칙으로 다시 정합니다.
#     자세한 내용: docs/AGENT_REACH.md
# =============================================================

enabled: true

# ★ 절대 true 로 바꾸지 마십시오.
#   자동 설치는 사용자 모르게 자격증명 설정을 건드릴 수 있습니다.
auto_install: false

# -------------------------------------------------------------
#  쿠키가 필요한 채널 (기본 차단)
# -------------------------------------------------------------
#  Twitter / Instagram / LinkedIn / 샤오홍슈 / 빌리빌리 등은
#  브라우저 세션 쿠키를 파일로 저장해야 동작합니다.
#
#  위험:
#   - 대부분 플랫폼의 이용약관 위반입니다
#   - 계정 정지 위험이 있습니다 (도구 공식 문서도 '부계정 사용'을 권장합니다)
#   - 세션 쿠키가 로컬 파일에 평문으로 남습니다
#
#  그래서 기본값은 false 입니다. 켜시려면 위험을 이해하신 뒤 바꾸세요.
allow_cookie_channels: false

# -------------------------------------------------------------
#  사용할 채널
# -------------------------------------------------------------
#  자격증명 불필요 (안전):
#    web        일반 웹페이지 읽기
#    rss        RSS 피드
#    youtube    자막 추출·검색
#    github     저장소·이슈
#    hackernews
#
#  쿠키 필요 (allow_cookie_channels: true 여야 동작):
#    twitter, instagram, linkedin, facebook,
#    xiaohongshu, bilibili, xueqiu, xiaoyuzhou
enabled_channels:
  - web
  - rss
  - youtube
  - github

# -------------------------------------------------------------
#  실행 상한 (외부 프로세스가 멈춰도 우리는 안 멈춥니다)
# -------------------------------------------------------------
read_timeout_seconds: 30
search_timeout_seconds: 60
max_results: 10

# -------------------------------------------------------------
#  등급 매핑 참고 (실제 판정은 config/source_tiers/default.yaml)
# -------------------------------------------------------------
#  Agent Reach 가 어디서 가져오든 등급은 도메인으로 정해집니다.
#    sec.gov       → Tier S
#    reuters.com   → Tier A
#    reddit.com    → Tier E  (수집 경로와 무관)
#  즉 "Agent Reach 로 가져왔으니 믿을 만하다" 는 성립하지 않습니다.
